<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="queye-local-token" content="__QY_LOCAL_TOKEN__"><title>雀夜 · 素材管理</title><link rel="stylesheet" href="css/asset-manager.css?v=8"></head>
<body><header><div><small>QUEYE · CHARACTER STUDIO</small><h1>素材管理</h1><p>立绘、配音和台词，在这里整理。</p></div><div class="top-actions"><button id="refresh">刷新列表</button><button id="sync">同步现用素材</button><button id="add">新增角色</button></div></header>
<main><aside><nav id="characters" aria-label="选择角色"></nav><p class="sync-note">每次保存前自动备份旧文件。游戏目录与补丁源会一起更新。</p><details><summary>最近的备份</summary><ul id="backups"></ul></details></aside>
<section class="content"><div id="message" role="status" aria-live="polite"></div><div id="empty">正在读取角色……</div><div id="editor" hidden><h2 id="name"></h2><p id="tagline"></p><div class="section-title"><h3>立绘</h3><label class="button">批量选择 PNG<input id="image-batch" type="file" accept="image/png" multiple hidden></label></div><p class="hint">可直接替换单张图片。批量文件按 stage-0～4、defeat 命名；导入前会列出对应槽位。</p><div id="images" class="images"></div>
<div id="voice-area"><div class="section-title"><h3>配音与字幕</h3><label class="button">批量选择配音<input id="voice-batch" type="file" accept=".wav,.mp3,.ogg" multiple hidden></label></div><input id="search" type="search" placeholder="搜索台词或事件" aria-label="搜索台词或事件"><p class="hint">支持 WAV、MP3、OGG。缺配音时保持静音；字幕可独立保存。</p><div id="voices" class="voices"></div></div></div></section></main>
<dialog id="add-dialog"><form id="add-form"><h2>新增角色</h2><label>角色名<input id="new-name" maxlength="40" required></label><label>选人小字<input id="new-tagline" maxlength="120"></label><p>请使用成年角色的非露骨立绘。创建后可逐项补齐素材；联机需重启服务后使用新角色。</p><div class="dialog-actions"><button type="button" id="add-cancel">取消</button><button class="primary" type="submit">创建角色</button></div></form></dialog>
<dialog id="import-dialog"><h2>确认导入</h2><p>以下素材将替换对应槽位，旧版本会先自动备份。</p><ul id="import-list"></ul><div class="dialog-actions"><button id="import-cancel">取消</button><button id="import-confirm" class="primary">导入并备份</button></div></dialog>
<script src="js/asset-manager.js?v=8"></script></body></html>
