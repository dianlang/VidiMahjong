server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /opt/queye/current;
    index traditional.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location = / { try_files /traditional.html =404; add_header Cache-Control no-store; }
    location = /traditional.html { try_files $uri =404; add_header Cache-Control no-store; }
    location = /index.html { return 302 /traditional.html; }
    location = /healthz { default_type application/json; return 200 '{"ok":true,"service":"queye-web"}'; }

    location = /ws {
        set $queye_origin_ok 0;
        if ($http_origin = "") { set $queye_origin_ok 1; }
        if ($http_origin = "$scheme://$http_host") { set $queye_origin_ok 1; }
        if ($queye_origin_ok = 0) { return 403; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location = /js/asset-manager.js { return 404; }
    location ^~ /assets/ { try_files $uri =404; expires 1d; }
    location /js/ { try_files $uri =404; add_header Cache-Control no-cache; }
    location /css/ { try_files $uri =404; add_header Cache-Control no-cache; }
    location / { return 404; }
}
